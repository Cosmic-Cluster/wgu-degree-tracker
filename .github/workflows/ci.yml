# ============================================================================
# CI for wgu-degree-tracker. Four independent jobs, so one failing doesn't hide
# the others:
#   lint     ESLint over the JS, including inline <script>s in the HTML pages
#   test     parser unit tests (no PDFs needed) + security guard + config schema
#   secrets  gitleaks CLI over the full git history (checksum-verified)
#   audit    npm audit over the dev dependencies
#
# The tracker itself has no build and no runtime dependencies. Everything npm
# installs here is developer tooling only.
#
# Actions are pinned to full commit SHAs (tag in the comment) so a moved or
# hijacked tag can't change what runs. Update them deliberately.
#
# The audit job has NO allowlist on purpose. See DECISIONS.md ("No pre-emptive
# suppression"): a known finding is recorded when CI actually reports it, in
# the commit that responds to that run, not before.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # --omit=optional skips canvas (a native module pdf.js can use for
      # rendering). Lint and unit tests never render, so it isn't needed.
      - run: npm ci --omit=optional
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      # Unit tests (incl. the CVE-2024-4367 mitigation guard) + config schema.
      # The real-PDF regression tests (npm run test:guides) need WGU's Program
      # Guide PDFs, which aren't in the repo, so they run locally only.
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    env:
      # Pinned gitleaks release + its official SHA-256 (from the release's
      # gitleaks_<ver>_checksums.txt). Update both together, deliberately.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: every commit is scanned, every run
      # Runs the gitleaks CLI directly instead of gitleaks-action. The action
      # scans only the commits in a push, as <first>^..<last>, which fails on
      # a repo's very first push (the root commit has no parent) and never
      # rescans older history. See DECISIONS.md.
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        # --redact keeps any secret it finds out of the public log.
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Audits package-lock.json, which includes optional and dev packages, so
      # nothing is scoped out. Fails on any advisory of any severity.
      - run: npm audit
